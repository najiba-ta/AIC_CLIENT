<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#075e46"/>
      <stop offset="70%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF0BE"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="75%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c22" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Stroke -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Center Artwork -->
  <g filter="url(#goldGlow)" transform="translate(100, 92)">
    <!-- Elegant Crescent Moon -->
    <path d="M 12 -38 A 38 38 0 1 0 12 38 A 32 32 0 1 1 12 -38 Z" fill="url(#goldGrad)" transform="rotate(-25)"/>

    <!-- Minaret & Dome Silhouette -->
    <!-- Center Dome -->
    <path d="M -16 28 C -16 10 16 10 16 28 Z" fill="url(#goldGrad)"/>
    <!-- Dome Finial/Crescent -->
    <line x1="0" y1="10" x2="0" y2="4" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="3" r="2" fill="url(#goldGrad)"/>

    <!-- Minaret Pillars -->
    <rect x="-8" y="20" width="16" height="12" fill="url(#goldGrad)" opacity="0.9"/>
    <polygon points="-12,20 12,20 0,10" fill="url(#goldGrad)"/>
    
    <!-- 8-Pointed Star -->
    <g transform="translate(14, -18) scale(0.65)">
      <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="url(#goldGrad)"/>
      <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="url(#goldGrad)" transform="rotate(45)"/>
    </g>
  </g>

  <!-- Bottom Banner Arc / Typography -->
  <text x="100" y="162" text-anchor="middle" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="url(#goldGrad)">
    AL HIDAYAH
  </text>
  <text x="100" y="178" text-anchor="middle" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#E2E8F0" opacity="0.9">
    ISLAMIC CENTER
  </text>
</svg>
